<style>
  :root { --brown:#4f3620; --green:#7d9a6c; --cream:#faf7f1; --ink:#2b2118; --muted:#6b5d50; --line:#e6ddd0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:"Source Serif 4", Georgia, serif; font-size:19px; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:0 20px; }
  header { padding:28px 0 0; text-align:center; }
  header img { display:block; margin:0 auto; width:100%; max-width:560px; height:auto; mix-blend-mode:multiply; }
  h1, h2 { font-family:Raleway, sans-serif; color:var(--brown); line-height:1.25; }
  h1 { font-size:34px; margin:28px 0 12px; text-align:center; }
  h2 { font-size:22px; margin:48px 0 10px; }
  .lede { text-align:center; font-size:21px; color:var(--ink); }
  .status { display:inline-block; font-family:Raleway, sans-serif; font-size:13px; font-weight:600; color:var(--green); border:1px solid var(--green); border-radius:20px; padding:3px 12px; }
  .center { text-align:center; }
  ul { padding-left:1.1em; } li { margin:8px 0; }
  li b { color:var(--brown); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; margin-top:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px; font-size:17px; }
  .card h3 { font-family:Raleway, sans-serif; color:var(--brown); font-size:16px; margin:0 0 6px; }
  blockquote { margin:24px 0; padding:4px 0 4px 18px; border-left:3px solid var(--green); font-style:italic; color:var(--muted); }
  a { color:var(--brown); }
  .btn { display:inline-block; font-family:Raleway, sans-serif; font-weight:600; background:var(--brown); color:#fff; text-decoration:none; padding:11px 22px; border-radius:6px; margin:6px; }
  .btn.alt { background:transparent; color:var(--brown); border:1.5px solid var(--brown); }
  nav { display:flex; justify-content:flex-end; gap:22px; padding-top:18px; font-family:Raleway, sans-serif; font-size:15px; font-weight:600; }
  nav a { text-decoration:none; }
  ol.qs { padding-left:1.3em; } ol.qs li { margin:10px 0; }
  footer { margin:64px 0 40px; padding-top:20px; border-top:1px solid var(--line); font-family:Raleway, sans-serif; font-size:14px; color:var(--muted); text-align:center; }
  @media (max-width:520px) { body { font-size:17px; } h1 { font-size:27px; } }
